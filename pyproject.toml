[project]
name = "electoral-api"
version = "0.1.0"
description = "REST API over the electoral Mesa model (TC2008B challenge); Unity polls it"
requires-python = ">=3.12"
dependencies = ["flask>=3.0", "electoral"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv.sources]
electoral = { path = "model", editable = true }   # git submodule

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["electoral_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
extend-exclude = ["model"]   # the submodule has its own lint config

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
